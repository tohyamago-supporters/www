summary:
  - 法人の設立初年度。任意団体から引き継いだ遊休農地活用の農作業を、下栗の各畑で通年にわたり実施しました。
  - 収穫した茶はみなみ信州農業協同組合南信濃支所へ製茶を委託し、BASE 株式会社の Web サービスを利用した通信販売と、ゲストハウス太陽堂での委託対面販売によりお分けしました。
