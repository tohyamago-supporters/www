name: 令和7年度
startDate: 2025-07-01
endDate: 2026-06-30
reportedOn: 2026-08-15
summary:
  - 農作業の実施回数は前年度から増え、下栗芋・下栗蕎麦・大豆・茶の四品目について、植付けから収穫・調製までを通年で実施しました。
  - 農作業のほかに、地域行事のもみじ狩りに参加する機会を得たほか、下栗蕎麦を食べる会を実施しました。
  - 収穫した茶はみなみ信州農業協同組合南信濃支所へ製茶を委託し、BASE 株式会社の Web サービスを利用した通信販売と、関係者を通じた直接販売によりお分けしました。
